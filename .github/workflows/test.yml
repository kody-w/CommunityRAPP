name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: python -m pytest -q tests --ignore=tests/grail_conformance

      - name: Check for PII patterns
        run: |
          echo "Scanning for hardcoded credentials and PII..."
          ISSUES=0

          # Check for hardcoded Azure resource names (common patterns)
          if git ls-files | xargs grep -l 'DefaultEndpointsProtocol=https;AccountName=[a-z]' 2>/dev/null | grep -v '.github/workflows'; then
            echo "❌ Found hardcoded connection strings"
            ISSUES=1
          fi

          # Check for API keys
          if git ls-files | xargs grep -lE 'sk-[a-zA-Z0-9]{20,}' 2>/dev/null | grep -v '.github/workflows'; then
            echo "❌ Found potential API keys"
            ISSUES=1
          fi

          # Check for email addresses in code (not docs/attribution)
          if git ls-files -- '*.py' '*.json' | xargs grep -lE '[a-zA-Z0-9._%+-]+@(microsoft|google|amazon|oracle)\.com' 2>/dev/null; then
            echo "❌ Found corporate email addresses in code"
            ISSUES=1
          fi

          if [ "$ISSUES" -eq 0 ]; then
            echo "✅ No PII patterns detected"
          else
            exit 1
          fi

  grail-conformance:
    # CommunityRAPP must answer /api/chat exactly like the Brainstem grail.
    # The grail is checked out read-only at a pinned SHA; bump GRAIL_SHA on purpose.
    runs-on: ubuntu-latest
    env:
      GRAIL_SHA: 0e43ee580e78c150b1c59002456822d2e779388e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kody-w/rapp-installer
          ref: ${{ env.GRAIL_SHA }}
          path: grail

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r grail/rapp_brainstem/requirements.txt

      - name: Run grail conformance
        env:
          GRAIL_DIR: ${{ github.workspace }}/grail/rapp_brainstem
          GRAIL_PYTHON: python
        run: python tests/grail_conformance/conformance.py
